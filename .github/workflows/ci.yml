name: CI — Tests RoomMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-unitaires:
    name: Tests unitaires (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx vitest run src/test/
        working-directory: backend

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: tests-unitaires
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t roommate-backend:${{ github.sha }} ./backend
      - name: Build image frontend
        run: docker build -t roommate-frontend:${{ github.sha }} ./frontend
      - name: Vérifier les images
        run: docker images | grep roommate