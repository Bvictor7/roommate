name: CI — Tests RoomMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: frontend
      - run: npx eslint src/ --max-warnings=0
        working-directory: frontend

  tests-unitaires:
    name: Tests unitaires (Vitest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx vitest run src/test/
        working-directory: backend

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: tests-unitaires
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t roommate-backend:${{ github.sha }} ./backend
      - run: docker build -t roommate-frontend:${{ github.sha }} ./frontend

  deploy-staging:
    name: Deploy staging (Render)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-prod:
    name: Deploy prod (approuvé)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy prod
        run: |
          echo "✅ Deploy prod approuvé et déployé"
          echo "Frontend: https://roommate-cda.netlify.app"
          echo "Backend: https://roommate-y4n7.onrender.com"
